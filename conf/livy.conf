livy.spark.master = local[*]
livy.spark.deploy-mode = client
livy.file.local-dir-whitelist = /app
livy.server.session.timeout = 1h

# Delta Lake — equivalent of your spark-submit --packages and --conf flags
livy.spark.packages = io.delta:delta-core_2.12:2.4.0
livy.spark.jars.ivy = /tmp/.ivy2
livy.spark.sql.extensions = io.delta.sql.DeltaSparkSessionExtension
livy.spark.sql.catalog.spark_catalog = org.apache.spark.sql.delta.catalog.DeltaCatalog